function viewResult(){
  const ids = Object.keys(P.first), ok = ids.filter(id => P.first[id]).length, tot = ids.length || 1;
  const pct = Math.round(ok / tot * 100), stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  const wrong = P.cards.filter(c => P.first[c.id] === false);
  const st = P.stepId ? stepById(P.stepId) : null, nxt = st && STEPS[st.cat][st.i + 1];
  return '<section><div class="res">' +
    '<div class="stars">' + [0,1,2].map(i => star(i < stars)).join('') + '</div>' +
    '<div class="score">' + ok + '<small> / ' + tot + '</small></div>' +
    '<div class="sub">' + J(P.mode === 'quiz' ? 'score' : 'learned') + tr(P.mode === 'quiz' ? 'score' : 'learned') + '</div>' +
    '<div class="msg">' + T('msg' + stars) + '</div>' +
    '<div class="xpgain">+<b>' + P.xp + '</b> ' + J('xp_get') + '</div></div>' +
    '<div class="btns">' +
      (wrong.length ? '<button class="btn lime" data-act="retrywrong"><span>' + J('retry_wrong') + '（<span class="num">' + wrong.length + '</span>）</span>' + tr('retry_wrong') + '</button>' : '') +
      (nxt ? '<button class="btn ' + (wrong.length ? 'soft' : 'lime') + '" data-act="nextstep" data-id="' + nxt.id + '"><span>' + J('next_step') + ' →</span><span class="sm">' + rb(nxt.t) + '</span></button>' : '') +
      '<button class="btn soft" data-act="retryall">' + T('retry_all') + '</button>' +
      '<button class="btn ghost" data-act="tab" data-v="home">' + T('home') + '</button>' +
    '</div></section>';
}

/* --- きろく --- */
function viewRecord(){
  const st = streak(), td = S.days[dayKey()] || 0, total = Object.keys(S.learned).length;
  const DOW = ['にち','げつ','か','すい','もく','きん','ど'];
  const start = new Date(); start.setDate(start.getDate() - 27);
  let cells = '';
  for (let i = 0; i < 7; i++){ const d = new Date(start); d.setDate(start.getDate() + i); cells += '<div class="dow">' + DOW[d.getDay()] + '</div>'; }
  for (let i = 0; i < 28; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const n = S.days[dayKey(d)] || 0, lv = n >= 30 ? 3 : n >= 10 ? 2 : n > 0 ? 1 : 0;
    cells += '<button class="d press' + (lv ? ' l' + lv : '') + (i === 27 ? ' today' : '') + '" data-act="day" data-d="' + dayKey(d) + '" aria-label="' + dayKey(d) + ' ' + n + '"></button>';
  }
  const cats = CAT_IDS.map(c => {
    const pr = catProgress(c);
    return '<div class="r"><div class="h"><span>' + J(c) + '</span><span>' + pr.n + ' / ' + pr.t + '</span></div><div class="minibar" style="--c:var(--' + c + ');height:8px"><i style="width:' + Math.round(pr.p * 100) + '%"></i></div></div>';
  }).join('');
  return '<section>' +
    '<div class="hbar">' + lvBar() + '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="v">' + IC.flame + st + '</div><div class="l">' + J('streak') + tr('streak') + '</div></div>' +
      '<div class="stat"><div class="v">' + td + '</div><div class="l">' + J('today') + tr('today') + '</div></div>' +
      '<div class="stat"><div class="v">' + total + '</div><div class="l">' + J('learned') + tr('learned') + '</div></div>' +
    '</div>' +
    '<div class="sect"><h2>' + T('recent') + '</h2></div><div class="heat"><div class="grid">' + cells + '</div><p class="heat-hint">' + J('tap_day') + tr('tap_day') + '</p></div>' +
    '<div class="sect"><h2>' + T('by_cat') + '</h2></div><div class="prog">' + cats + '</div>' +
  '</section>';
}

/* --- せってい --- */
function seg(act, items, cur){
  return '<div class="seg">' + items.map(([v, k]) => '<button data-act="' + act + '" data-v="' + v + '" aria-pressed="' + (String(cur) === String(v)) + '">' + T(k) + '</button>').join('') + '</div>';
}
const sw = (act, on) => '<span class="sw" role="switch" aria-checked="' + on + '"></span>';
function voiceList(){
  if (!JA_VOICES.length) return '<p class="vhint">' + J('no_voice') + tr('no_voice') + '</p>';
  const cur = VOICE ? VOICE.name : '';
  return '<div class="voices">' + JA_VOICES.slice(0, 8).map((v, i) =>
    '<button class="vbtn press" data-act="voice" data-i="' + i + '" aria-pressed="' + (v.name === cur) + '">' +
    '<span class="vn">' + esc(v.name.replace(/^Microsoft /, '').replace(/ - Japanese.*$| \(Japan\)/i, '')) + '</span>' +
    (i === 0 ? '<span class="vb">' + esc(UI.recommend.ja) + '</span>' : '') + IC.speak + '</button>').join('') + '</div>';
}
function viewSettings(){
  const L = LANG();
  return '<section>' +
    '<div class="hbar"><div style="font-size:26px;font-weight:800;line-height:1.2">' + J('settings') + tr('settings') + '</div></div>' +
    (ME() ? '<div class="me-card">' + avatar(ME(), 52) + '<div class="me-t"><b>' + esc(ME().name) + ' さん</b><span>' + [ME().cls, ME().no].filter(Boolean).map(esc).join('・') + '</span></div>' +
      '<button class="btn soft press" data-act="logout">' + IC.user + '<span>' + J('switch_user') + '</span></button></div>' : '') +
    '<div class="list" style="margin-top:16px">' +
      '<button class="li press" data-act="tab" data-v="lang"><span class="k">' + T('language') + '</span><span class="v"' + (L ? ' lang="' + L.tag + '"' : '') + '>' + esc(L ? L.name : UI.jp_only.ja) + '</span>' + IC.chev + '</button>' +
      (L ? '<button class="li" data-act="meaning"><span class="k">' + T('meaning') + '</span>' + sw('meaning', S.meaning) + '</button>' +
           '<button class="li" data-act="trui"><span class="k">' + T('show_tr') + '</span>' + sw('trui', S.trUI) + '</button>' : '') +
    '</div>' +
    '<div class="sect"><h2>' + T('script') + '</h2></div>' +
    '<div class="seg col">' + [['furi','kanji_furi'],['kanji','kanji_only'],['kana','kana_only']].map(([v, k]) => '<button data-act="script" data-v="' + v + '" aria-pressed="' + (S.script === v) + '">' + T(k) + '</button>').join('') + '</div>' +
    '<div class="sect"><h2>' + T('voice') + '</h2></div>' + seg('speed', [['slow','slow'],['normal','normal'],['fast','fast']], S.speed) +
    '<div class="sect"><h2>' + T('voice_pick') + '</h2></div><div class="list"><div class="li col" style="padding-top:4px">' +
      (HAS_TTS ? voiceList() + '<p class="vhint">' + J('voice_hint') + tr('voice_hint') + '</p>' : '<p class="vhint" style="margin-top:4px">' + J('no_tts') + tr('no_tts') + '</p>') + '</div></div>' +
    '<div class="sect"><h2>' + T('bgm') + '</h2></div>' +
    '<div class="list"><button class="li" data-act="music"><span class="k">' + IC.music.replace('<svg', '<svg class="li-ic"') + T(DEV.bgm ? 'on' : 'off') + '</span>' + sw('music', DEV.bgm) + '</button></div>' +
    (DEV.bgm ? '<div class="sub-h">' + T('bgm_track') + '</div>' +
    '<div class="seg tracks">' + BGM.TRACKS.map(t => '<button data-act="track" data-v="' + t + '" aria-pressed="' + (DEV.track === t) + '">' + T('bgm_' + t) + '</button>').join('') + '</div>' +
    '<div class="sub-h">' + T('vol') + '</div>' + seg('vol', [['s','vol_s'],['m','normal'],['l','vol_l']], DEV.vol) +
    '<p class="vhint" style="margin:8px 4px 0">' + J('bgm_hint') + tr('bgm_hint') + '</p>' : '') +
    '<div class="list" style="margin-top:14px"><button class="li" data-act="sound"><span class="k">' + T('sound') + '</span>' + sw('sound', S.sound) + '</button>' +
      '<button class="li press" data-act="reset"><span class="k danger">' + T('reset') + '</span></button>' +
      '<button class="li press" data-act="deluser"><span class="k danger">' + T('delete_user') + '</span></button></div>' +
    '<p class="note-s">' + J('memo_local') + tr('memo_local') + '</p>' +
  '</section>';
}

/* --- 日ごとの きろく（シート） --- */
function openDaySheet(key){
  const [y, m, d] = key.split('-').map(Number), dt = new Date(y, m - 1, d);
  const DOW = ['にち','げつ','か','すい','もく','きん','ど'];
  const n = S.days[key] || 0, L = S.log[key];
  let body = '<h3>' + rb(m + '月[がつ]' + d + '日[にち]') + '（' + DOW[dt.getDay()] + '）</h3>';
  if (!n){
    body += '<p class="day-empty">' + J('day_none') + tr('day_none') + '</p>';
  } else {
    let ok = 0, ng = 0;
    if (L) for (const f in L){ ok += L[f][0]; ng += L[f][1]; }
    body += '<div class="day-stats"><div><b class="num">' + n + '</b>' + J('day_did') + tr('day_did') + '</div>' +
      (L ? '<div class="g"><b class="num">' + ok + '</b>' + J('day_ok') + tr('day_ok') + '</div><div class="r"><b class="num">' + ng + '</b>' + J('day_ng') + tr('day_ng') + '</div>' : '') + '</div>';
    if (L){
      const rows = Object.keys(L).sort((a, b) => (L[b][0] + L[b][1]) - (L[a][0] + L[a][1]));
      body += '<div class="day-list">' + rows.map(k => {
        const [c, f] = k.split('|'), [a, b] = L[k], t = a + b;
        return '<div class="day-row" style="--c:var(--' + c + ')"><span class="dot"></span><span class="nm">' + J(c) + '・' + plainLabel(c, f) + '</span>' +
          '<span class="ct"><span class="g">' + a + '</span> / <span class="r">' + b + '</span></span>' +
          '<span class="bar2"><i style="width:' + Math.round(a / t * 100) + '%"></i></span></div>';
      }).join('') + '</div>';
    } else body += '<p class="day-empty">' + J('day_old') + tr('day_old') + '</p>';
  }
  $('#sheet .body').innerHTML = body;
  $('#sheet .foot').innerHTML = '<button class="btn soft" data-act="sclose">' + T('close') + '</button>';
  showSheet();
}

/* ---------- モーダル・トースト ---------- */
let modalYes = null;
function confirmBox(k, onYes){
  modalYes = onYes;
  const m = $('#modal');
  m.querySelector('.box').innerHTML = '<p class="q">' + T(k) + '</p><div class="row">' +
    '<button class="btn soft" data-act="mno">' + T('no') + '</button><button class="btn lime" data-act="myes">' + T('yes') + '</button></div>';
  m.hidden = false;
  m.querySelector('[data-act="mno"]').focus();
}
function closeModal(){ $('#modal').hidden = true; modalYes = null; }
let toastT = 0;
function toast(k, ms){
  const t = $('#toast'); t.innerHTML = T(k); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 1800);
}

/* ---------- 操作 ---------- */
function toggleIn(arr, v){ const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
const ACT = {
  tab: a => { if (a.dataset.v === 'lang') go('lang', {first:false, from:V.name}); else go(a.dataset.v); },
  back: () => goBack(V.name === 'lang' ? (V.from || 'settings') : 'home'),
  lang: a => {
    const first = V.first || !DEV.lang;
    DEV.lang = a.dataset.id; saveDev();
    if (DEV.current){ S.lang = DEV.lang; save(); }
    if (first){ go('login', {intro:true}, {replace:true}); return; }
    goBack(V.from || (DEV.current ? 'settings' : 'login'));
  },
  pickuser: a => enterUser(a.dataset.id),
  newuser: () => { V.form = true; V.intro = false; render(); const el = $('#f-name'); el && el.focus(); },
  loginlist: () => { V.form = false; V.intro = false; render(); },
  mkuser: () => makeUser(),
  logout: () => { DEV.current = null; saveDev(); load(); P = null; go('login', {intro:true}, {replace:true}); },
  deluser: () => confirmBox('delete_user_q', () => {
    const id = DEV.current; DEV.profiles = DEV.profiles.filter(u => u.id !== id); DEV.current = null; saveDev();
    try { localStorage.removeItem(PKEY(id)); } catch(e){}
    load(); P = null; go('login', {intro:true}, {replace:true});
  }),
  music: () => {
    DEV.bgm = !DEV.bgm; saveDev();
    if (DEV.bgm) startBGM(); else BGM.stop();
    keepScroll(render);
  },
  track: a => { DEV.track = a.dataset.v; DEV.bgm = true; saveDev(); BGM.play(DEV.track, VOL[DEV.vol]); keepScroll(render); },
  vol: a => { DEV.vol = a.dataset.v; saveDev(); BGM.setVolume(VOL[DEV.vol]); if (DEV.bgm) startBGM(); keepScroll(render); },
  cat: a => go('cat', {cat:a.dataset.cat}),
  tsu: a => go('tsu', {book:+a.dataset.b}),
  htab: a => { S.prefs.tsu.home = a.dataset.v; save(); render(); },
  tsl: a => { if (!+a.dataset.l) return; if (V.name === 'tsl') go('tsl', {les:+a.dataset.l}, {replace:true}); else go('tsl', {les:+a.dataset.l}); },
  tscope: a => { S.prefs.tsu.scope = a.dataset.v; save(); keepScroll(render); },
  tcat: a => { const pr = S.prefs.tsu; toggleIn(pr.cats, a.dataset.c); save(); keepScroll(render); },
  tmode: a => { S.prefs.tsu.mode = a.dataset.m; save(); keepScroll(render); },
  tcount: a => { S.prefs.tsu.count = +a.dataset.n; save(); keepScroll(render); },
  tstart: () => { const pr = S.prefs.tsu; startTsu(V.les, tsuScope(V.les), TCATS, V.pick); },
  tcountnext: () => { const pr = S.prefs.tsu, o = [10, 20, 0]; pr.count = o[(o.indexOf(pr.count) + 1) % o.length]; save(); keepScroll(render); },
  tstyle: a => { S.prefs.tsu.style = a.dataset.v; save(); keepScroll(render); },
  tpick: a => { V.pick = V.pick || []; toggleIn(V.pick, a.dataset.k); keepScroll(render); },
  tpickclear: () => { V.pick = []; keepScroll(render); },
  cont: () => { const l = S.last; if (!l) return; if (l.tsu) startTsu(l.tsu.les, l.tsu.scope, l.tsu.cats, l.tsu.picks, l.tsu.style); else startFrom(l.cat, l.forms, l.stepId, l.title); },
  step: a => openStepSheet(V.cat, a.dataset.id),
  custom: () => openStepSheet(V.cat, null),
  smode: a => { S.prefs[SH.cat].mode = a.dataset.m; save(); renderSheet(); },
  scount: a => { S.prefs[SH.cat].count = +a.dataset.n; save(); renderSheet(); },
  smore: () => { SH.more = !SH.more; renderSheet(); },
  sgroup: a => { const g = +a.dataset.g, pr = S.prefs.verb; toggleIn(pr.groups, g); save(); renderSheet(); },
  cform: a => { toggleIn(SH.forms, a.dataset.f); S.prefs[SH.cat].custom = SH.forms.slice(); save(); renderSheet(); },
  cgroup: a => {
    const fs = stepById(a.dataset.id).step.forms, allOn = fs.every(f => SH.forms.includes(f));
    SH.forms = allOn ? SH.forms.filter(f => !fs.includes(f)) : SH.forms.concat(fs.filter(f => !SH.forms.includes(f)));
    S.prefs[SH.cat].custom = SH.forms.slice(); save(); renderSheet();
  },
  sstart: () => {
    const sh = SH, s = sh.stepId ? stepById(sh.stepId).step : null;
    const order = catForms(sh.cat).filter(f => sh.forms.includes(f));
    startFrom(sh.cat, order, sh.stepId, s ? s.t : UI.custom.ja);
  },
  flip: () => flip(),
  again: () => flyAway(-1),
  got: () => flyAway(1),
  say: (a, e) => { e.stopPropagation(); speak(sayText(P.cur, a.dataset.side)); },
  sayans: () => speak(sayText(P.cur, 'back')),
  pick: a => pick(+a.dataset.i),
  next: () => nextCard(),
  quit: () => confirmBox('quit_q', quitPlay),
  retrywrong: () => startSession(P.cat, P.mode, shuffle(P.cards.filter(c => P.first[c.id] === false)), P.stepId),
  retryall: () => startSession(P.cat, P.mode, shuffle(P.cards), P.stepId),
  nextstep: a => { const st = stepById(a.dataset.id); go('cat', {cat:st.cat}); openStepSheet(st.cat, st.step.id); },
  script: a => { S.script = a.dataset.v; save(); keepScroll(render); },
  meaning: () => { S.meaning = !S.meaning; save(); keepScroll(render); },
  trui: () => { S.trUI = !S.trUI; save(); keepScroll(render); },
  sound: () => { S.sound = !S.sound; save(); keepScroll(render); if (S.sound) SFX.good(); },
  speed: a => { S.speed = a.dataset.v; save(); keepScroll(render); speak('書きます。書いて。'); },
  voice: a => { const v = JA_VOICES[+a.dataset.i]; if (!v) return; S.voice = v.name; VOICE = v; save(); keepScroll(render); speak('こんにちは。ドアが あきます。'); },
  reset: () => confirmBox('reset_q', () => { S.learned = {}; S.days = {}; S.log = {}; S.xp = 0; S.last = null; save(); render(); }),
  day: a => openDaySheet(a.dataset.d),
  install: () => { if (!INSTALL) return; INSTALL.prompt(); INSTALL.userChoice.finally(() => { INSTALL = null; render(); }); },
  insthide: () => { S.installHide = true; save(); render(); },
  sclose: () => closeSheet(),
  myes: () => { const f = modalYes; closeModal(); f && f(); },
  mno: () => closeModal(),
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a){
    if (e.target.id === 'modal') closeModal();
    if (e.target.id === 'scrim') closeSheet();
    return;
  }
  const f = ACT[a.dataset.act];
  if (f) f(a, e);
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.matches && e.target.matches('input, textarea')){
    if (e.key === 'Enter' && V.name === 'login'){ e.preventDefault(); makeUser(); }
    return;
  }
  if (!$('#modal').hidden){ if (e.key === 'Escape') closeModal(); return; }
  if (SH && e.key === 'Escape'){ closeSheet(); return; }
  if (V.name !== 'play' || !P) return;
  if (P.mode === 'card'){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
    else if (P.flipped && e.key === 'ArrowRight') flyAway(1);
    else if (P.flipped && e.key === 'ArrowLeft') flyAway(-1);
  } else {
    if (!P.answered && /^[1-4]$/.test(e.key)) pick(+e.key - 1);
    else if (P.answered && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextCard(); }
  }
});
window.addEventListener('resize', () => document.querySelectorAll('.fit').forEach(fit));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => document.querySelectorAll('.fit').forEach(fit));

// さいしょの タップで 音楽を はじめる（ブラウザの きまり）
document.addEventListener('pointerdown', () => { if (DEV.bgm) startBGM(); }, true);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) BGM.stop(true);
  else if (DEV.bgm) startBGM();
});

loadDev();
load();
V = DEV.lang ? {name:'login', intro:true} : {name:'lang', first:true};
ST = [hashOf(V)];
replaceHash(hashOf(V));
render();

</script>
