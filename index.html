<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D111C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>フラッシュカード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="フラッシュカード">
<script>
window.PWA = true;
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@700;800;900&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans+Myanmar:wght@500;700&display=swap" rel="stylesheet">
<style>
/* フラッシュカード（学習者用）v2 — dark, game-like; light "paper" cards on a night background.
   One column for phones; category colour (coral / sun / mint / sky) drives each screen; lime = the main action. */
:root{
  color-scheme:dark;
  --bg:#0D111C; --s1:#161D30; --s2:#1E2740; --s3:#29344F; --line:rgba(255,255,255,.07);
  --tx:#F3F5FC; --mu:#9AA4C2; --mu2:#6C7695;
  --lime:#C6F05A; --lime-ink:#1A2306;
  --verb:#FF7A66; --iadj:#FFC94D; --naadj:#4FE0AE; --noun:#72B4FF;
  --verb-p:#FFE6E1; --iadj-p:#FFF2D2; --naadj-p:#DDF8EE; --noun-p:#E2EEFF;
  --ok:#4FE0AE; --ng:#FF6B7F;
  --paper:#FBFAF6; --ink:#141826; --ink-mu:#6B7088;
  --acc:var(--verb); --acc-p:var(--verb-p);
  --r:22px;
  --f-ja:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;
  --f-lat:"Nunito","M PLUS Rounded 1c",system-ui,sans-serif;
}
body[data-cat="iadj"]{--acc:var(--iadj);--acc-p:var(--iadj-p)}
body[data-cat="naadj"]{--acc:var(--naadj);--acc-p:var(--naadj-p)}
body[data-cat="noun"]{--acc:var(--noun);--acc-p:var(--noun-p)}
body[data-cat="tsu"]{--acc:#C79BFF;--acc-p:#EFE5FF}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--f-ja);font-weight:500;line-height:1.5;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;text-align:inherit}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 104px) calc(env(safe-area-inset-left) + 18px)}
body.no-tab #app{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}

/* translations */
.tr bdi{unicode-bidi:isolate}
.tr{display:block;font-family:var(--f-lat);font-weight:700;font-size:.68em;color:var(--mu);line-height:1.3;margin-top:1px}
.mean{font-family:var(--f-lat);font-weight:700}
:lang(zh-CN){font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif!important}
:lang(ne){font-family:"Noto Sans Devanagari",sans-serif!important}
:lang(bn){font-family:"Noto Sans Bengali",sans-serif!important}
:lang(ur){font-family:"Noto Naskh Arabic",sans-serif!important;line-height:1.7}
:lang(my){font-family:"Noto Sans Myanmar",sans-serif!important;line-height:1.75}

/* ruby: one <ruby> per kanji run, readings spread evenly */
ruby{ruby-position:over;ruby-align:space-around}
rt{font-size:.46em;font-weight:700;opacity:.72;letter-spacing:0}

.press{transition:transform .1s ease,filter .1s ease}
.press:active{transform:scale(.97);filter:brightness(.92)}
.num{font-family:var(--f-lat);font-weight:900;letter-spacing:-.01em}
.icon{width:22px;height:22px;flex:none}

/* buttons */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:58px;padding:8px 18px;border-radius:18px;
  background:var(--s2);font-weight:800;font-size:19px;line-height:1.2;text-align:center}
.btn .tr{color:inherit;opacity:.7}
.btn.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 6px 0 var(--lime-d,#86AD25)}
.btn.lime:active{transform:translateY(4px);box-shadow:0 2px 0 #86AD25}
.btn.ok{background:var(--ok);color:#06231A;box-shadow:0 6px 0 #2BA37B}
.btn.ok:active{transform:translateY(4px);box-shadow:0 2px 0 #2BA37B}
.btn.soft{background:var(--s2);color:var(--tx);box-shadow:0 6px 0 #10162A}
.btn.soft:active{transform:translateY(4px);box-shadow:0 2px 0 #10162A}
.btn.ghost{background:transparent;min-height:44px;font-size:15px;color:var(--mu)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:12px}
.row > *{flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s1);flex:none}

/* headings */
.sect{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.sect h2{font-size:18px;font-weight:800;line-height:1.3}
.sect h2 .tr{font-size:.66em}

/* ---- home ---- */
.hbar{display:flex;align-items:center;gap:12px;min-height:48px}
.lv{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.lv-badge{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#2F3B5E,#1C2540);display:grid;place-items:center;flex:none;position:relative}
.lv-badge b{font-family:var(--f-lat);font-weight:900;font-size:20px;color:var(--lime)}
.lv-badge small{position:absolute;bottom:-6px;font-size:9px;font-weight:800;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:0 6px;font-family:var(--f-lat);letter-spacing:.04em}
.lv-txt{flex:1;min-width:0}
.lv-txt .t{font-size:13px;font-weight:700;color:var(--mu);display:flex;justify-content:space-between}
.xpbar{height:10px;border-radius:99px;background:var(--s2);overflow:hidden;margin-top:5px}
.xpbar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .6s ease}
.pill{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 13px 0 9px;border-radius:99px;background:var(--s1);font-family:var(--f-lat);font-weight:900;font-size:17px}
.pill svg{width:22px;height:22px}
.pill.off{color:var(--mu2)}

.hero{margin-top:18px;border-radius:26px;padding:20px 20px 18px;background:radial-gradient(120% 140% at 100% 0%,rgba(198,240,90,.16),transparent 55%),var(--s1);position:relative;overflow:hidden}
.hero .hi{font-size:22px;font-weight:800;line-height:1.3}
.hero .hi .tr{font-size:13px;margin-top:3px}
.hero .today{display:flex;gap:18px;margin:14px 0 16px}
.hero .today div{font-size:12px;color:var(--mu);font-weight:700;line-height:1.3}
.hero .today b{display:block;font-size:26px;color:var(--tx);font-family:var(--f-lat);font-weight:900;line-height:1.1}
.cont-btn{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px 12px 12px;border-radius:18px;background:var(--lime);color:var(--lime-ink);box-shadow:0 6px 0 #86AD25;text-align:left}
.cont-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #86AD25}
.cont-btn .play{width:44px;height:44px;border-radius:14px;background:rgba(26,35,6,.12);display:grid;place-items:center;flex:none}
.cont-btn .play svg{width:22px;height:22px}
.cont-btn .tx{flex:1;min-width:0}
.cont-btn .tx b{display:block;font-size:18px;font-weight:800;line-height:1.25}
.cont-btn .tx span{display:block;font-size:13px;font-weight:700;opacity:.75;line-height:1.5}

.inst{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 12px 12px 14px;border-radius:20px;background:var(--s1);border:1.5px solid rgba(198,240,90,.35)}
.inst img{width:44px;height:44px;border-radius:12px;flex:none}
.inst .tx{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.5}
.inst .tx small{display:block;font-size:12px;font-weight:700;color:var(--mu);line-height:1.8}
.inst .tx .tr{font-size:11px}
.inst .go{flex:none;padding:8px 14px;border-radius:12px;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:14px}
.inst .x{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mu2)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:150px;padding:16px;border-radius:24px;background:var(--s1);overflow:hidden;text-align:left}
.cat::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.16}
.cat .glyph{width:42px;height:42px;border-radius:13px;background:var(--c);color:#111;display:grid;place-items:center;font-size:21px;font-weight:800;margin-bottom:12px}
.cat h3{font-size:20px;font-weight:800;line-height:1.2}
.cat h3 .tr{font-size:12px;margin-top:2px}
.cat .meta{display:block;margin-top:auto;padding-top:10px;width:100%}
.cat .meta .n{font-size:12px;font-weight:700;color:var(--mu);display:flex;justify-content:space-between}
.minibar{display:block;height:6px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:5px}
.minibar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:99px}

/* ---- category (steps) ---- */
.cat-top{display:flex;align-items:center;gap:10px}
.cat-head{margin-top:14px;padding:20px;border-radius:26px;background:var(--s1);background:radial-gradient(140% 120% at 0% 0%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 60%),var(--s1)}
.cat-head .t{display:flex;align-items:center;gap:14px}
.cat-head h1{font-size:28px;font-weight:800;line-height:1.15}
.cat-head h1 .tr{font-size:13px;margin-top:4px}
.ring{width:64px;height:64px;flex:none;margin-left:auto;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-lat);font-weight:900;font-size:16px}
.cat-head .sub{margin-top:12px;font-size:13px;font-weight:700;color:var(--mu)}
.steps{display:flex;flex-direction:column;gap:10px;position:relative}
.step{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:20px;background:var(--s1);text-align:left;position:relative}
.step .no{width:48px;height:48px;flex:none;position:relative}
.step .no svg{width:48px;height:48px;transform:rotate(-90deg)}
.step .no b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-lat);font-weight:900;font-size:17px}
.step.done .no b{color:var(--bg)}
.step .tx{flex:1;min-width:0}
.step .tt{font-size:17px;font-weight:800;line-height:1.85}
.step .mm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mu);line-height:1.3}
.lvtag{font-family:var(--f-lat);font-weight:900;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--s3);color:var(--tx)}
.lvtag.n5{background:rgba(198,240,90,.18);color:var(--lime)}
.lvtag.n4{background:rgba(114,180,255,.18);color:var(--noun)}
.step .chev{color:var(--mu2)}
.step.custom{background:transparent;border:2px dashed var(--s3)}
.step.custom .no{display:grid;place-items:center;border-radius:50%;background:var(--s2)}
.step.custom .no svg{width:24px;height:24px;transform:none}

/* ---- bottom sheet ---- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,8,15,.6);opacity:0;transition:opacity .2s ease}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:88vh;display:flex;flex-direction:column;
  background:var(--s1);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:8px 18px calc(env(safe-area-inset-bottom) + 16px)}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--s3);margin:4px auto 12px;flex:none}
.sheet .body{overflow:auto;flex:1;min-height:0;padding-bottom:6px}
.sheet h3{font-size:22px;font-weight:800;line-height:1.7}
.sheet .forms{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.ftag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:10px;background:var(--s2);font-size:14px;font-weight:700;line-height:1.85}
.lbl{font-size:13px;font-weight:800;color:var(--mu);margin:18px 2px 8px;line-height:1.3}
.lbl .tr{display:inline;margin-left:6px;font-size:11px;color:var(--mu2)}
.seg{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--bg)}
.seg button{flex:1;min-height:46px;padding:4px 8px;border-radius:12px;font-weight:800;font-size:16px;line-height:1.2;text-align:center;color:var(--mu)}
.seg button .tr{font-size:10.5px;color:inherit;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--tx)}
.seg.col{flex-direction:column}
.seg.col button{text-align:left;padding:8px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:4px 14px;border-radius:12px;background:var(--s2);font-weight:700;font-size:15px;line-height:1.85;color:var(--mu)}
.chip[aria-pressed="true"]{background:var(--acc);color:#111}
.chip .ck{width:16px;height:16px;display:none}
.chip[aria-pressed="true"] .ck{display:block}
.more{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:14px;font-weight:800;color:var(--mu)}
.more svg{width:18px;height:18px;transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.cgroup{margin-top:12px}
.cgroup .gh{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;font-weight:800;color:var(--mu);margin:0 2px 6px;line-height:1.9}
.cgroup .gh button{font-size:12px;font-weight:800;color:var(--lime);padding:2px 4px}
.sheet .foot{flex:none;padding-top:12px}

/* ---- play ---- */
.ptop{display:flex;align-items:center;gap:12px}
.ptrack{flex:1;height:12px;border-radius:99px;background:var(--s2);overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s ease}
.pnum{font-family:var(--f-lat);font-weight:900;font-size:15px;color:var(--mu);min-width:48px;text-align:right}
.stage{position:relative;perspective:1400px;margin:20px 0 22px}
.stage::before{content:"";position:absolute;left:14px;right:14px;bottom:-10px;height:40px;border-radius:0 0 28px 28px;background:var(--s2);z-index:0}
.card{position:relative;z-index:1;height:clamp(330px,56vh,470px);touch-action:pan-y;cursor:pointer;transition:transform .25s ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card.quiz{height:auto;cursor:default}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.card.quiz .inner{position:relative}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px;border-radius:28px;background:var(--paper);color:var(--ink);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card.quiz .face{position:relative;min-height:220px}
.face.back{transform:rotateY(180deg);background:var(--acc-p)}
.face-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:3px 16px;border-radius:14px;background:var(--acc);color:#111;font-weight:800;font-size:20px;line-height:1.9}
.target{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px;max-width:100%}
.target .arrow{font-size:26px;font-weight:800;line-height:1;color:var(--acc);filter:brightness(.85)}
.tchip{display:inline-block;max-width:100%;padding:6px 22px;border-radius:18px;background:var(--acc);color:#111;font-weight:800;font-size:30px;line-height:1.75;white-space:nowrap}
.card.quiz .tchip{font-size:28px}
.say{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(20,24,38,.07);color:var(--ink);flex:none}
.say svg{width:22px;height:22px}
.say.muted{opacity:.45}
.face-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:0;padding:6px 0}
.lead{font-size:24px;font-weight:700;line-height:1.8;margin-bottom:-14px}
.big{font-size:48px;font-weight:800;line-height:1.5;white-space:nowrap;max-width:100%}
.from{font-size:17px;font-weight:700;color:var(--ink-mu);line-height:1.9;white-space:nowrap;max-width:100%}
.meta{font-size:12px;font-weight:800;padding:1px 10px;border-radius:8px;background:rgba(20,24,38,.08);color:var(--ink-mu);line-height:1.9}
.mean{max-width:100%;font-size:15px;padding:4px 12px;border-radius:10px;background:rgba(20,24,38,.06);color:var(--ink-mu);line-height:1.4}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-mu);text-align:center;line-height:1.3}
.hint{flex-wrap:wrap;column-gap:6px;row-gap:0}
.hint .tr{display:block;width:100%;font-size:11px;color:var(--ink-mu)}
.notes{background:rgba(255,255,255,.7);border-radius:16px;padding:8px 12px;font-size:14px;line-height:2;max-height:38%;overflow:auto;color:var(--ink)}
.notes b{display:inline-block;font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:0 7px;line-height:1.8;margin-right:6px}
.stamp{pointer-events:none;position:absolute;top:22px;padding:3px 14px;border-radius:12px;font-size:22px;font-weight:800;opacity:0;transition:opacity .1s;color:#fff}
.stamp.s-got{right:18px;background:#1FB386;transform:rotate(8deg)}
.stamp.s-again{left:18px;background:#E5536A;transform:rotate(-8deg)}
.card.lean-got .s-got,.card.lean-again .s-again{opacity:1}
.swipe-hint{text-align:center;font-size:12px;font-weight:700;color:var(--mu2);margin-top:12px}
.qtitle{font-size:15px;font-weight:800;text-align:center;margin:0 0 10px;color:var(--mu);line-height:1.3}
.qtitle .tr{font-size:11px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border-radius:18px;background:var(--s1);box-shadow:0 5px 0 #0A0F1C;font-size:22px;font-weight:800;text-align:left;line-height:1.3;white-space:nowrap;overflow:hidden}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #0A0F1C}
.opt .n{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--s3);color:var(--mu);font-family:var(--f-lat);font-weight:900}
.opt .w{flex:1;min-width:0}
.opt.ok{background:rgba(79,224,174,.18);box-shadow:0 5px 0 rgba(79,224,174,.35)}
.opt.ok .n{background:var(--ok);color:#06231A}
.opt.ng{background:rgba(255,107,127,.16);box-shadow:0 5px 0 rgba(255,107,127,.35);animation:shake .35s}
.opt.ng .n{background:var(--ng);color:#2A0710}
.opt.dim{opacity:.4}
.fb{margin-top:14px;padding:14px;border-radius:22px;display:flex;flex-direction:column;gap:10px;background:var(--s1)}
.fb .msg{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;line-height:1.2}
.fb.good .msg{color:var(--ok)} .fb.bad .msg{color:var(--ng)}
.fb .msg .tr{font-size:12px;color:var(--mu)}
.fb .msg svg{width:32px;height:32px;flex:none}
.fb .notes{background:var(--s2);color:var(--tx)}
.fb .notes b{background:var(--tx);color:var(--bg)}
.fb .say{background:var(--s2);color:var(--tx);margin-left:auto}

/* ---- result ---- */
.res{text-align:center;padding:28px 18px 22px;margin-top:22px;border-radius:28px;background:var(--s1);background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),var(--s1)}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:10px}
.stars svg{width:50px;height:50px}
.stars svg:nth-child(2){width:64px;height:64px;margin-bottom:8px}
.res .score{font-family:var(--f-lat);font-weight:900;font-size:58px;line-height:1}
.res .score small{font-size:24px;color:var(--mu)}
.res .sub{font-size:13px;font-weight:700;color:var(--mu);margin-top:4px}
.res .msg{font-size:26px;font-weight:800;margin-top:12px;line-height:1.2}
.res .msg .tr{font-size:14px;margin-top:4px}
.xpgain{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 14px;border-radius:99px;background:rgba(198,240,90,.14);color:var(--lime);font-weight:800;font-size:15px}
.xpgain b{font-family:var(--f-lat);font-weight:900;font-size:20px}
.btns{display:grid;gap:14px;margin-top:22px}
.btn .sm{display:block;font-size:14px;font-weight:700;opacity:.85;line-height:1.8}

/* ---- records ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{padding:14px 12px;border-radius:20px;background:var(--s1)}
.stat .v{display:flex;align-items:center;gap:4px;font-family:var(--f-lat);font-weight:900;font-size:28px;line-height:1.1}
.stat .v svg{width:24px;height:24px}
.stat .l{font-size:12px;font-weight:800;color:var(--mu);margin-top:4px;line-height:1.3}
.stat .l .tr{font-size:10px}
.heat{padding:16px;border-radius:22px;background:var(--s1)}
.heat .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .dow{font-size:11px;font-weight:800;color:var(--mu2);text-align:center}
.heat .d{aspect-ratio:1;border-radius:8px;background:var(--s2);width:100%}
.heat-hint{font-size:12px;color:var(--mu2);margin-top:12px;line-height:1.6}
.heat-hint .tr{font-size:11px;color:var(--mu2)}
.day-empty{margin:14px 2px 8px;color:var(--mu);font-weight:700;line-height:1.8}
.day-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.day-stats div{padding:12px;border-radius:16px;background:var(--s2);font-size:12px;font-weight:800;color:var(--mu);line-height:1.3}
.day-stats b{display:block;font-size:28px;color:var(--tx);line-height:1.1}
.day-stats .g b{color:var(--ok)} .day-stats .r b{color:var(--ng)}
.day-stats .tr{font-size:10px}
.day-list{display:grid;gap:8px;margin-top:14px}
.day-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:10px;row-gap:4px;padding:10px 12px;border-radius:14px;background:var(--s2)}
.day-row .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.day-row .nm{font-size:15px;font-weight:800;line-height:1.85}
.day-row .ct{font-family:var(--f-lat);font-weight:900;font-size:15px;color:var(--mu)}
.day-row .g{color:var(--ok)} .day-row .r{color:var(--ng)}
.day-row .bar2{grid-column:2 / 4;height:6px;border-radius:99px;background:rgba(255,107,127,.35);overflow:hidden}
.day-row .bar2 i{display:block;height:100%;background:var(--ok)}
.heat .d.l1{background:rgba(198,240,90,.28)} .heat .d.l2{background:rgba(198,240,90,.55)} .heat .d.l3{background:var(--lime)}
.heat .d.today{outline:2px solid var(--tx);outline-offset:1px}
.prog{padding:16px;border-radius:22px;background:var(--s1);display:grid;gap:14px}
.prog .r .h{display:flex;justify-content:space-between;font-size:14px;font-weight:800;line-height:1.3}
.prog .r .h span:last-child{font-family:var(--f-lat);font-size:13px;color:var(--mu)}

/* ---- settings ---- */
.list{border-radius:22px;background:var(--s1);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .k{flex:1;min-width:0;font-size:16px;font-weight:800;line-height:1.3}
.li .k .tr{font-size:11px}
.li .v{font-size:15px;font-weight:700;color:var(--mu);text-align:right}
.li.col{flex-direction:column;align-items:stretch}
.sw{width:52px;height:32px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--lime)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.voices{display:grid;gap:6px;margin-top:8px}
.vbtn{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 12px;border-radius:14px;background:var(--s2);font-weight:700;font-size:15px;text-align:left;line-height:1.3;color:var(--mu)}
.vbtn .vn{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--f-lat)}
.vbtn .vb{flex:none;font-size:11px;font-weight:800;padding:1px 8px;border-radius:6px;background:rgba(198,240,90,.16);color:var(--lime)}
.vbtn svg{width:20px;height:20px;flex:none}
.vbtn[aria-pressed="true"]{background:var(--s3);color:var(--tx)}
.vhint{font-size:12px;color:var(--mu);line-height:1.5;margin-top:8px}
.vhint .tr{font-size:11px}
.danger{color:var(--ng)}
.note-s{font-size:12px;color:var(--mu2);text-align:center;margin-top:16px;line-height:1.5}
.note-s .tr{font-size:11px;color:var(--mu2)}

/* ---- language ---- */
.welcome{text-align:center;padding-top:26px}
.welcome .logo{width:92px;height:92px;margin:0 auto}
.welcome h1{font-size:30px;font-weight:800;margin-top:14px}
.welcome p{font-size:15px;font-weight:700;color:var(--mu);margin-top:4px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.lang-btn{min-height:60px;padding:8px 12px;border-radius:18px;background:var(--s1);font-size:19px;font-weight:700;text-align:center;line-height:1.3}
.lang-btn[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.lang-btn.jp{grid-column:1 / -1;font-family:var(--f-ja);font-weight:800}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);width:min(440px,calc(100% - 28px));z-index:20;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:24px;background:rgba(22,29,48,.88);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
body.no-tab .tabbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;padding:4px;border-radius:18px;font-size:12px;font-weight:800;line-height:1.15;color:var(--mu2);text-align:center}
.tab svg{width:24px;height:24px}
.tab .tr{font-size:9.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit}
.tab[aria-current="page"]{color:var(--lime);background:rgba(198,240,90,.1)}

/* ---- modal + toast ---- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(5,8,15,.65)}
.modal .box{width:min(360px,100%);padding:22px;border-radius:24px;background:var(--s1);text-align:center}
.modal .q{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:18px}
.modal .q .tr{font-size:13px;margin-top:4px}
.toast{width:max-content;max-width:calc(100% - 32px);line-height:1.4;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,calc(-100% - 60px));visibility:hidden;z-index:70;padding:10px 18px;border-radius:16px;background:var(--lime);color:var(--lime-ink);font-weight:800;text-align:center;transition:transform .25s ease;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast .tr{font-size:12px;color:var(--lime-ink);opacity:.8}

.enter{animation:rise .3s cubic-bezier(.2,.9,.3,1)}


/* ===== 教科書モード ===== */
.sent{font-size:24px;font-weight:800;line-height:2.05;text-align:left;color:var(--ink);word-break:normal;overflow-wrap:anywhere;padding:0 4px}
.sent ruby rt{font-size:.45em}
.sent .slot{color:var(--acc);filter:brightness(.8);white-space:nowrap}
.face.back .sent{font-size:23px}
.sent mark{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--acc) 55%,transparent) 55%);color:inherit;padding:0 2px;border-radius:3px}
.sent-tag{font-size:12px;font-weight:800;color:var(--ink-mu);line-height:1.6}
.sent-tag rt{font-size:.6em}
.face .from rt{font-size:.5em}
.seg.style button{font-size:15px}
.fpick{gap:4px;min-height:38px;padding:3px 12px;border:2px solid transparent;color:var(--tx)}
.fpick[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#111}
.fpick svg{width:15px;height:15px}
.lf{--c:var(--acc)}
.rv-note{margin:0 4px 14px;line-height:1.7}
.pick-hint{display:flex;align-items:flex-start;gap:6px;margin:-4px 4px 10px;font-size:13px;font-weight:700;color:var(--mu);line-height:1.5}
.pick-hint svg{flex:none;margin-top:3px}
.pick-hint .tr{display:block;font-size:11px}
.pick-bar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--acc) 22%,var(--s1));font-weight:800}
.pick-bar button{padding:6px 14px;border-radius:12px;background:var(--s2);font-weight:800;font-size:14px}
.pn{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin-left:.15em}
.pn .pw{line-height:1.6}
.pn small{font-size:.46em;font-weight:800;opacity:.72;line-height:1.3;margin-top:-.15em}
.pn small rt{font-size:.6em}
.fchip .pn small{font-size:.55em}
.books{display:flex;flex-direction:column;gap:10px}
.book{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border-radius:24px;text-align:left;
  background:radial-gradient(120% 140% at 0% 0%,rgba(199,155,255,.22),transparent 60%),var(--s1)}
.book .chev{color:var(--mu2)}
.bk-sp{position:relative;width:46px;height:56px;flex:none}
.bk-sp i{position:absolute;inset:0;border-radius:8px 12px 12px 8px;background:#C79BFF}
.bk-sp i:nth-child(1){transform:translate(8px,-4px) rotate(8deg);background:var(--noun);opacity:.8}
.bk-sp i:nth-child(2){transform:translate(4px,-2px) rotate(4deg);background:var(--naadj);opacity:.9}
.bk-sp i:nth-child(3){box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
.bk-tx{flex:1;min-width:0;line-height:1.25}
.bk-tx b{display:block;font-size:22px;font-weight:800}
.bk-s{display:block;font-size:12px;font-weight:800;color:#C79BFF;letter-spacing:.02em}
.bk-l{font-size:13px;font-weight:800;color:var(--mu)}
.cat-head h1 .bk-s{font-size:13px;margin-bottom:2px}
.les-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.les{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:104px;padding:12px;border-radius:20px;background:var(--s1);text-align:left}
.les.done{background:color-mix(in srgb,var(--acc) 18%,var(--s1))}
.les-n{font-size:24px;font-weight:900;line-height:1}
.les-r{position:absolute;top:10px;right:10px;width:40px;height:40px}
.les-r svg{width:40px;height:40px}
.les-m{margin-top:auto;display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:var(--mu);line-height:1.2}
.les-m .dots{display:flex;gap:4px;min-height:8px}
.les-m .dots i{width:8px;height:8px;border-radius:50%}
.lforms{display:flex;flex-direction:column;gap:10px}
.lf,.lw{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:18px;background:var(--s1)}
.lf-c{flex:none;min-width:56px;padding:3px 9px;border-radius:9px;background:var(--c);color:#111;font-size:12px;font-weight:800;line-height:1.7;text-align:center}
.lf-t{display:flex;flex-wrap:wrap;gap:6px}
.lwords{margin-top:12px;border-radius:18px;background:var(--s1);overflow:hidden}
.lwords summary{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer;list-style:none}
.lwords summary::-webkit-details-marker{display:none}
.lwords summary svg{width:18px;height:18px;margin-left:auto;transition:transform .2s}
.lwords[open] summary svg{transform:rotate(180deg)}
.lwords .lw{background:transparent;padding:4px 16px 14px;flex-direction:column;gap:8px}
.lw-t{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:16px;font-weight:700;line-height:2}
.seg.scope button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:58px}
.seg.scope b{font-size:16px}
.seg.scope .sd{font-size:12px;font-weight:700;color:var(--mu)}
.tsl .chips{display:flex;flex-wrap:wrap;gap:8px}
.tsl .chip[aria-pressed="true"]{background:var(--c,var(--acc))}
.tsl .chip[disabled]{opacity:.35}
.tstart{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);margin-top:20px;z-index:3}
.tstart .btn{box-shadow:0 10px 30px rgba(0,0,0,.45)}


/* ===== 整理した レイアウト ===== */
.hometab{margin:18px 0 14px;padding:5px;border-radius:18px;background:var(--s1)}
.hometab button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;font-size:16px}

.hometab button > span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.hometab .tr{font-size:11px}
.series-list{display:flex;flex-direction:column;gap:12px}
.series{padding:14px;border-radius:24px;background:radial-gradient(120% 140% at 0% 0%,rgba(199,155,255,.18),transparent 60%),var(--s1)}
.sr-h{display:flex;align-items:center;gap:12px;margin:0 2px 12px}
.sr-h .bk-sp{width:30px;height:36px}
.sr-h b{font-size:17px;font-weight:800;color:#C79BFF}
.sr-h b rt{font-size:.5em}
.sr-vols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vol{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 30px 12px 14px;border-radius:18px;background:var(--s2);text-align:left}
.vol b{font-size:21px;font-weight:800;line-height:1.3}
.vol b rt{font-size:.45em}
.vol span{font-size:13px;font-weight:800;color:var(--mu)}
.vol .chev{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu2)}
.cats .cat{min-height:124px}
.step-h{margin:16px 4px 2px;font-size:15px;font-weight:800;color:var(--mu)}
.step-h:first-child{margin-top:0}
.step-h .tr{font-size:11px}
/* 課の 画面 */
.les-nav{margin-left:auto;display:flex;gap:8px}
.les-nav button[disabled]{opacity:.3}
.flip-x svg{transform:scaleX(-1)}
.les-head{display:flex;align-items:center;gap:14px;margin-top:12px;padding:16px 18px;border-radius:24px;background:radial-gradient(140% 120% at 0% 0%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 60%),var(--s1)}
.les-head > div:first-child{flex:1;min-width:0}
.les-head .bk-s{font-size:13px}
.les-head > div:first-child b{display:block;font-size:34px;font-weight:900;line-height:1.05}
.ring.sm{width:52px;height:52px}
.ring.sm svg{width:52px;height:52px}
.ring.sm b{font-size:13px}
.seg.big{margin-top:14px}
.seg.big button{min-height:50px;font-size:16px}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.blk-h h2{font-size:17px;font-weight:800}
.blk-h h2 rt{font-size:.5em}
.mini{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:99px;background:color-mix(in srgb,var(--acc) 30%,var(--s1));font-size:13px;font-weight:800}
.mini svg{width:14px;height:14px}
.seg.range button{font-size:14px;min-height:46px;line-height:1.3}
.seg.range rt{font-size:.5em}

.dock{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:3;margin-top:22px;padding:10px;border-radius:24px;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}
.dock-opts{display:flex;gap:8px;align-items:stretch}
.mini-seg{flex:1;padding:4px;border-radius:14px}
.mini-seg button{min-height:38px;font-size:14px}
.cnt{display:inline-flex;align-items:center;gap:4px;padding:0 12px;border-radius:14px;background:var(--bg);font-weight:800;font-size:14px;white-space:nowrap}
.cnt svg{width:16px;height:16px;color:var(--mu)}
.dock .btn{min-height:56px}
.tsl .lforms .lf{padding:10px 12px}

/* ===== はじめの 画面（ログイン） ===== */
body.is-login{background:radial-gradient(90% 50% at 50% 0%,rgba(198,240,90,.13),transparent 70%),radial-gradient(70% 40% at 0% 100%,rgba(114,180,255,.12),transparent 70%),var(--bg)}

.lang-chip svg{width:20px;height:20px;color:var(--lime)}
.mbtn svg{width:22px;height:22px}

.iconbtn.sm{width:40px;height:40px;border-radius:13px}
.hbar .mbtn{margin-left:auto}
.ptop .mbtn{margin-left:2px}
.lg-hero{text-align:center;padding:22px 0 8px}
.lg-cards{position:relative;width:150px;height:128px;margin:0 auto}

.spark.s1{left:4px;top:10px}.spark.s2{right:2px;top:2px;background:var(--naadj);width:8px;height:8px}.spark.s3{right:12px;bottom:4px;background:var(--lime);width:7px;height:7px}
.lg-title{margin-top:14px;font-size:clamp(28px,9.4vw,38px);white-space:nowrap;font-weight:800;letter-spacing:.02em;line-height:1.15}
.lg-title span{display:inline-block}
.lg-sub{margin-top:6px;font-size:15px;font-weight:700;color:var(--mu)}
.lg-sub .tr{font-size:12px;margin-top:2px}
.lg-panel{margin-top:auto;padding:20px 16px 14px;border-radius:28px;background:var(--s1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.lp-h{font-size:21px;font-weight:800;line-height:1.3;margin:0 4px 12px}
.lp-h .tr{font-size:12px}
.whos{display:flex;flex-direction:column;gap:8px}

<script>
/* ===== 語彙データ（教師用「初級活用カード」と同じ語） ===== */
// 動詞: [漢字ます形, よみ, グループ, オプション]

// no: 作らない形, ov: 例外の形
const VERBS = [
  ['書きます','かきます',1,{oni:1,hum:1}],
  ['聞きます','ききます',1,{oni:1,hum:1,kenjo:['伺います','うかがいます','「拝聴[はいちょう]します」とも 言[い]います']}],

  ['わかります','わかります',1,{oni:1,no:['ishi','kano','ukemi','shieki','meirei','reru']}],
  ['あります','あります',1,{aru:1,no:['ishi','kano','ukemi','shieki','meirei','reru','naide'],ov:{nai:['ない','ない']}}],
  ['食べます','たべます',2,{resp:['召し上がります','めしあがります'],kenjo:['いただきます','いただきます']}],
  ['見ます','みます',2,{x2:1,resp:['ご覧になります','ごらんになります'],kenjo:['拝見します','はいけんします']}],
  ['寝ます','ねます',2,{resp:['お休みになります','おやすみになります']}],
  ['起きます','おきます',2,{x2:1}],
  ['います','います',2,{x2:1,resp:['いらっしゃいます','いらっしゃいます'],kenjo:['おります','おります'],no:['ukemi','reru']}],
  ['着ます','きます',2,{x2:1,resp:['お召しになります','おめしになります']}],
  ['借ります','かります',2,{x2:1,oni:1,hum:1}],
  ['浴びます','あびます',2,{x2:1}],
  ['降ります','おります',2,{x2:1,oni:1}],
  ['できます','できます',2,{x2:1,no:['ishi','kano','ukemi','shieki','meirei','reru']}],
  ['教えます','おしえます',2,{oni:1,hum:1}],
  ['開けます','あけます',2,{hum:1}],
  ['閉めます','しめます',2,{hum:1}],
  ['見せます','みせます',2,{oni:1,hum:1}],
  ['忘れます','わすれます',2,{oni:1}],
  ['調べます','しらべます',2,{oni:1,hum:1}],
  ['出ます','でます',2,{}],
  ['あげます','あげます',2,{kenjo:['さしあげます','さしあげます']}],
  ['くれます','くれます',2,{kureru:1,resp:['くださいます','くださいます'],no:['ishi','kano','ukemi','shieki','reru'],ov:{meirei:['くれ','くれ']}}],
  ['来ます','きます',3,{kuru:1,resp:['いらっしゃいます','いらっしゃいます','「お見[み]えになります」「おいでになります」とも 言[い]います'],kenjo:['参ります','まいります']}],
  ['します','します',3,{resp:['なさいます','なさいます'],kenjo:['いたします','いたします']}],
  ['勉強します','べんきょうします',3,{}],
  ['散歩します','さんぽします',3,{}],
  ['電話します','でんわします',3,{goR:'お',goH:'お',den:1}],
  ['説明します','せつめいします',3,{goR:'ご',goH:'ご'}],
  ['案内します','あんないします',3,{goR:'ご',goH:'ご'}],
  ['連絡します','れんらくします',3,{goR:'ご',goH:'ご'}],
  ['紹介します','しょうかいします',3,{goR:'ご',goH:'ご'}],
  ['利用します','りようします',3,{goR:'ご'}],
  ['出席します','しゅっせきします',3,{goR:'ご'}],
];

// 自動詞・他動詞: [名詞漢字, 名詞よみ, 自動詞, よみ, 他動詞, よみ]
const PAIRS = [
  ['ドア','ドア','開きます','あきます','開けます','あけます'],
  ['窓','まど','閉まります','しまります','閉めます','しめます'],
  ['電気','でんき','つきます','つきます','つけます','つけます'],
  ['電気','でんき','消えます','きえます','消します','けします'],
  ['授業','じゅぎょう','始まります','はじまります','始めます','はじめます'],
  ['車','くるま','止まります','とまります','止めます','とめます'],
  ['財布','さいふ','落ちます','おちます','落とします','おとします'],
  ['いす','いす','壊れます','こわれます','壊します','こわします'],
  ['コップ','コップ','割れます','われます','割ります','わります'],
  ['服','ふく','汚れます','よごれます','汚します','よごします'],
  ['予定','よてい','変わります','かわります','変えます','かえます'],
  ['日にち','ひにち','決まります','きまります','決めます','きめます'],
  ['人','ひと','集まります','あつまります','集めます','あつめます'],
  ['本','ほん','並びます','ならびます','並べます','ならべます'],
  ['値段','ねだん','上がります','あがります','上げます','あげます'],
  ['温度','おんど','下がります','さがります','下げます','さげます'],
  ['子ども','こども','起きます','おきます','起こします','おこします'],
  ['荷物','にもつ','届きます','とどきます','届けます','とどけます'],
  ['かぎ','かぎ','見つかります','みつかります','見つけます','みつけます'],
  ['時計','とけい','直ります','なおります','直します','なおします'],
  ['話','はなし','続きます','つづきます','続けます','つづけます'],
  ['お金','おかね','減ります','へります','減らします','へらします'],
  ['ごはん','ごはん','残ります','のこります','残します','のこします'],
  ['機械','きかい','動きます','うごきます','動かします','うごかします'],
  ['お湯','おゆ','沸きます','わきます','沸かします','わかします'],
  ['ボタン','ボタン','外れます','はずれます','外します','はずします'],
  ['かぎ','かぎ','かかります','かかります','かけます','かけます'],
  ['水','みず','出ます','でます','出します','だします'],
  ['荷物','にもつ','入ります','はいります','入れます','いれます'],
];

const IADJ = [
  ['高い','たかい'],['安い','やすい'],['大きい','おおきい'],['小さい','ちいさい'],['新しい','あたらしい'],
  ['古い','ふるい'],['暑い','あつい'],['寒い','さむい'],['おいしい','おいしい'],['難しい','むずかしい'],
  ['易しい','やさしい'],['楽しい','たのしい'],['忙しい','いそがしい'],['広い','ひろい'],['近い','ちかい'],
  ['遠い','とおい'],['長い','ながい'],['白い','しろい'],['多い','おおい'],
  ['いい','いい',{sp:1}],['かっこいい','かっこいい',{sp:1}],
];
const NAADJ = [
  ['きれい','きれい',{ii:1}],['静か','しずか'],['有名','ゆうめい'],['親切','しんせつ'],['元気','げんき'],
  ['暇','ひま'],['便利','べんり'],['好き','すき'],['嫌い','きらい',{ii:1}],['上手','じょうず'],
  ['下手','へた'],['簡単','かんたん'],['大変','たいへん'],['にぎやか','にぎやか'],['大切','たいせつ'],
  ['大丈夫','だいじょうぶ'],['ハンサム','ハンサム'],
];
const NOUNS = [
  ['学生','がくせい'],['先生','せんせい'],['雨','あめ'],['休み','やすみ'],['日曜日','にちようび'],
  ['病気','びょうき'],['医者','いしゃ'],['会社員','かいしゃいん'],['子ども','こども'],['晴れ','はれ'],
  ['大人','おとな'],['日本人','にほんじん'],
];

/* ===== 活用エンジン ===== */
const ROW = {'い':'わいうえお','き':'かきくけこ','ぎ':'がぎぐげご','し':'さしすせそ','ち':'たちつてと','に':'なにぬねの','び':'ばびぶべぼ','み':'まみむめも','り':'らりるれろ'};
const col = (stem, c) => stem.slice(0,-1) + ROW[stem.slice(-1)][c];
const TE = {'い':'って','ち':'って','り':'って','に':'んで','び':'んで','み':'んで','き':'いて','ぎ':'いで','し':'して'};
const G2 = {jisho:'る',te:'て',ta:'た',nai:'ない',ishi:'よう',kano:'られる',ukemi:'られる',shieki:'させる',shiekiukemi:'させられる',meirei:'ろ',ba:'れば'};
const SURU = {jisho:'する',te:'して',ta:'した',nai:'しない',ishi:'しよう',kano:'できる',ukemi:'される',shieki:'させる',shiekiukemi:'させられる',meirei:'しろ',ba:'すれば'};
const KURU = {jisho:'くる',te:'きて',ta:'きた',nai:'こない',ishi:'こよう',kano:'こられる',ukemi:'こられる',shieki:'こさせる',shiekiukemi:'こさせられる',meirei:'こい',ba:'くれば'};
const BASE = ['jisho','te','ta','nai','ishi','kano','ukemi','shieki','shiekiukemi','meirei','ba'];
const DERIVED = {
  nakatta:['nai', s => s.slice(0,-1) + 'かった'],
  naide:['nai', s => s + 'で'],
  nakereba:['nai', s => s.slice(0,-1) + 'ければ'],
  tara:['ta', s => s + 'ら'],
  tari:['ta', s => s + 'り'],
  kinshi:['jisho', s => s + 'な'],
  reru:['ukemi', s => s.slice(0,-1) + 'ます'],
};
const POLITE = {masen:'ません', mashita:'ました', masendeshita:'ませんでした', mashou:'ましょう'};

function plain(stem, g, f, o, kanjiSide){
  if (g === 3){
    if (o.kuru) return (kanjiSide ? '来' + KURU[f].slice(1) : KURU[f]);
    return stem.slice(0,-1) + SURU[f];
  }
  if (g === 2) return stem + G2[f];
  const last = stem.slice(-1), head = stem.slice(0,-1);
  switch (f){
    case 'jisho': return col(stem,2);
    case 'te': case 'ta': {
      let t = o.iku ? 'って' : TE[last];
      if (f === 'ta') t = t.slice(0,-1) + (t.endsWith('で') ? 'だ' : 'た');
      return head + t;
    }
    case 'nai': return col(stem,0) + 'ない';
    case 'ishi': return col(stem,4) + 'う';
    case 'kano': return col(stem,3) + 'る';
    case 'ukemi': return col(stem,0) + 'れる';
    case 'shieki': return col(stem,0) + 'せる';
    case 'shiekiukemi': return col(stem,0) + (last === 'し' ? 'せられる' : 'される');
    case 'meirei': return col(stem,3);
    case 'ba': return col(stem,3) + 'ば';
  }
  return null;
}

function blocked(o, f){
  const no = o.no || [];
  if (no.includes(f)) return true;
  if (f === 'shiekiukemi' && no.includes('shieki')) return true;
  if (f === 'kinshi' && no.includes('meirei')) return true;
  return false;
}

function verbForm(w, f){
  const [k, r, g, o = {}] = w;
  if (blocked(o, f)) return null;
  if (o.ov && o.ov[f]) return o.ov[f].slice(0,2);
  const sk = k.slice(0,-2), sr = r.slice(0,-2);
  if (BASE.includes(f)) return [plain(sk, g, f, o, true), plain(sr, g, f, o, false)];
  if (DERIVED[f]){
    const [src, fn] = DERIVED[f];
    const b = verbForm(w, src);
    return b ? [fn(b[0]), fn(b[1])] : null;
  }
  if (POLITE[f]) return [sk + POLITE[f], sr + POLITE[f]];
  const nk = sk.slice(0,-1), nr = sr.slice(0,-1); // する動詞の名詞の部分
  switch (f){
    case 'sonkei':
      return o.resp ? o.resp.slice(0,2) : null;
    case 'kenjo':
      return o.kenjo ? o.kenjo.slice(0,2) : null;
    case 'oninaru':
      if (g === 3 && o.goR) return [o.goR + nk + 'になります', o.goR + nr + 'になります'];
      if (o.oni) return ['お' + sk + 'になります', 'お' + sr + 'になります'];
      return null;
    case 'oshimasu':
      if (g === 3 && o.goH) return [o.goH + nk + 'します', o.goH + nr + 'します'];
      if (o.hum) return ['お' + sk + 'します', 'お' + sr + 'します'];
      return null;
  }
  return null;
}

// メモ（やさしい日本語。漢字[よみ] でふりがな）
function verbNotes(w, f){
  const [k, r, g, o = {}] = w, n = [];
  const last = r.slice(-3, -2);
  if (g === 1 && last === 'い' && ['nai','nakatta','naide','nakereba','ukemi','shieki','shiekiukemi','reru'].includes(f))
    n.push('「い」は「わ」に なります（買[か]わない）');
  if (o.iku && ['te','ta','tara','tari'].includes(f)) n.push('とくべつ！「行[い]いて」じゃ ありません');
  if (o.aru && ['nai','nakatta','nakereba'].includes(f)) n.push('とくべつ！「あらない」じゃ ありません');
  if (o.kureru && f === 'meirei') n.push('とくべつ！「くれろ」じゃ ありません');
  if (o.kuru && BASE.concat(Object.keys(DERIVED)).includes(f)) n.push('「来[く]る」は とくべつな 形[かたち]');
  if (f === 'shiekiukemi' && g === 1){
    if (last !== 'し') n.push('「～せられる」とも 言[い]います');
    else n.push('「す」で 終[お]わる 動詞[どうし]は「～させられる」');
  }
  if (g === 2 && f === 'kano') n.push('話[はな]す とき「ら」が ない 形[かたち]も 聞[き]きます');
  if (f === 'kinshi') n.push('辞書形[じしょけい] ＋ な');
  if (f === 'reru') n.push('受身形[うけみけい]と 同[おな]じ 形[かたち]');
  if (f === 'sonkei' && o.resp && o.resp[2]) n.push(o.resp[2]);
  if (f === 'kenjo' && o.kenjo && o.kenjo[2]) n.push(o.kenjo[2]);
  if (o.den && (f === 'oninaru' || f === 'oshimasu' || f === 'sonkei' || f === 'kenjo')) n.push('「電話[でんわ]」は「ご」じゃなくて「お」');
  return n;
}

const IADJ_SUF = {te:'くて',ta:'かった',nai:'くない',nakatta:'くなかった',nakute:'くなくて',tara:'かったら',pNai:'くないです',pTa:'かったです',adv:'く',naru:'くなります',sugiru:'すぎます',ba:'ければ'};
function iadjForm(w, f){
  const [k, r, o = {}] = w;
  if (f === 'jisho') return [k, r];
  const suf = IADJ_SUF[f];
  if (!suf) return null;
  const b = s => o.sp ? s.slice(0,-2) + 'よ' : s.slice(0,-1);
  if (f === 'sugiru' && o.sp) return [b(k) + 'さ' + suf, b(r) + 'さ' + suf];
  return [b(k) + suf, b(r) + suf];
}
const NA_SUF = {jisho:'だ',te:'で',ta:'だった',nai:'じゃない',nakatta:'じゃなかった',nakute:'じゃなくて',tara:'だったら',pNai:'じゃありません',pTa:'でした',adv:'に',mod:'な',naru:'になります',sugiru:'すぎます',ba:'なら'};
const NOUN_SUF = {jisho:'だ',te:'で',ta:'だった',nai:'じゃない',nakatta:'じゃなかった',nakute:'じゃなくて',tara:'だったら',pNai:'じゃありません',pTa:'でした',mod:'の',naru:'になります',ba:'なら'};
const sufForm = table => (w, f) => { const s = table[f]; return s == null ? null : [w[0] + s, w[1] + s]; };
function adjNotes(cat, w, f){
  const o = w[2] || {}, n = [];
  if (cat === 'iadj'){
    if (o.sp && f !== 'jisho') n.push(f === 'sugiru' ? '「いい」は「よさすぎます」' : '「いい」は「よ」で 変[か]わります');
    if (f === 'pNai') n.push('「～くありません」とも 言[い]います');
  } else {
    if (o.ii) n.push('「い」で 終[お]わりますが、な形容詞[けいようし]です');
    if (f === 'nai') n.push('「～ではない」とも 言[い]います');
    if (f === 'nakatta') n.push('「～ではなかった」とも 言[い]います');
    if (f === 'nakute') n.push('「～ではなくて」とも 言[い]います');
    if (f === 'pNai') n.push('「～ではありません」「～じゃないです」とも 言[い]います');
    if (f === 'mod') n.push('後[うし]ろに 名詞[めいし]が 来[き]ます');
  }
  return n;
}

};

const GROUP_NAME = {1:'Ⅰグループ',2:'Ⅱグループ',3:'Ⅲグループ'};

function formOf(cat, w, f){
  if (cat === 'verb') return verbForm(w, f);
  if (cat === 'iadj') return iadjForm(w, f);
  if (cat === 'naadj') return sufForm(NA_SUF)(w, f);
  return sufForm(NOUN_SUF)(w, f);
}
function frontOf(cat, w){ return cat === 'verb' ? [w[0], w[1]] : [w[0] + 'です', w[1] + 'です']; }

// 1枚のカードを作る
function makeCard(cat, f, w){
  const back = formOf(cat, w, f);
  if (!back) return null;
  return {
    id: cat + '|' + f + '|' + w[0], cat, form: f, key: w[0],
    front: frontOf(cat, w), back,
    meta: cat === 'verb' ? GROUP_NAME[w[2]] : '',
    notes: cat === 'verb' ? verbNotes(w, f) : adjNotes(cat, w, f),
    word: w,
  };
}
function makePairCard(f, p){
  const a = [p[2], p[3]], t = [p[4], p[5]];
  const [from, to] = f === 'jita' ? [a, t] : [t, a];
  const [pf, pt] = f === 'jita' ? ['が','を'] : ['を','が'];
  return {
    id: 'verb|' + f + '|' + p[0] + '|' + from[0], cat:'verb', form:f, key: from[0], pair:p,
    front: from, back: to,
    fLead: [p[0] + pf, p[1] + pf], bLead: [p[0] + pt, p[1] + pt],
    meta: '',
    notes: [f === 'jita' ? '「が」→「を」に なります' : '「を」→「が」に なります'],
  };
}

// 選んだ形・グループでデッキを作る
function buildDeck(cat, forms, groups){
  const out = [];
  const order = SECTIONS[cat].flatMap(s => s[1]).filter(f => forms.includes(f));
  const words = CATS.find(c => c.id === cat).words;
  for (const f of order){
    if (f === 'jita' || f === 'taji'){ for (const p of PAIRS) out.push(makePairCard(f, p)); continue; }
    for (const w of words){
      if (cat === 'verb' && groups && !groups.includes(w[2])) continue;
      const c = makeCard(cat, f, w);
      if (c) out.push(c);
    }
  }
  return out;
}
function allForms(cat){ return SECTIONS[cat].flatMap(s => s[1]); }

// クイズの選択肢
function quizOptions(card){
  const ans = card.back;
  const seen = new Set([ans[0]]), opts = [];
  const add = x => { if (x && !seen.has(x[0])){ seen.add(x[0]); opts.push(x); } };
  if (card.pair){
    const p = card.pair, f = card.form;
    const [pf, pt] = f === 'jita' ? ['が','を'] : ['を','が'];
    const n = [p[0], p[1]];
    const L = (lead, v) => [n[0] + lead + ' ' + v[0], n[1] + lead + ' ' + v[1]];
    const correct = L(pt, card.back);
    seen.clear(); seen.add(correct[0]);
    add(L(pf, card.back)); add(L(pt, card.front)); add(L(pf, card.front));
    return shuffle([{v:correct, ok:true}].concat(opts.slice(0,3).map(v => ({v, ok:false}))));
  }
  const sec = SECTIONS[card.cat].find(s => s[1].includes(card.form))[1];
  const near = shuffle(sec.filter(f => f !== card.form));
  const far = shuffle(allForms(card.cat).filter(f => f !== card.form && !sec.includes(f) && f !== 'jita' && f !== 'taji'));
  for (const f of near.concat(far)){
    if (opts.length >= 3) break;
    add(formOf(card.cat, card.word, f));
  }
  return shuffle([{v:ans, ok:true}].concat(opts.map(v => ({v, ok:false}))));
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ===== ふりがな：漢字の部分だけに読みを割り当てる ===== */
const KANJI_RE = /[㐀-鿿豈-﫿々〆ヶ]/;
function rubySegments(surface, reading){
  const toks = [];
  for (const ch of surface){
    const kj = KANJI_RE.test(ch);
    if (toks.length && toks[toks.length-1].kj === kj) toks[toks.length-1].s += ch;
    else toks.push({s:ch, kj});
  }
  if (!toks.some(t => t.kj)) return [[surface, '']];
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('^' + toks.map(t => t.kj ? '(.+?)' : '(' + esc(t.s) + ')').join('') + '$');
  const m = reading.match(re);
  if (!m) return [[surface, reading]];
  return toks.map((t, i) => [t.s, t.kj ? m[i+1] : '']);
}

  const o = w[5] || {}, p = o.pre || ['', ''];
  return {p, k: w[2].slice(p[0].length), r: w[3].slice(p[1].length), o};
}
function tvBase(w, f){
  const {p, k, r, o} = tCore(w);
  let K = k, R = r, res;
  if (f === 'masu') res = [k.slice(0, -2), r.slice(0, -2)];
  else if (o.ra && f === 'meirei') res = [k.slice(0, -2), r.slice(0, -2)];      // いらっしゃい・なさい
  else {
    if (o.ra){ K = k.slice(0, -3) + 'ります'; R = r.slice(0, -3) + 'ります'; }   // いらっしゃいます → いらっしゃる
    const eo = {};
    if (o.iku) eo.iku = 1;
    if (o.kuru) eo.kuru = 1;
    if (o.aru) eo.ov = {nai:['ない','ない']};
    res = verbForm([K, R, w[4], eo], f);
  }
  if (res && /^kano/.test(f)) res = res.map(x => x.replace(/をでき/, 'ができ'));   // 無理をします → 無理ができる
  return res ? [p[0] + res[0], p[1] + res[1]] : null;
}
const sfx = (b, s, cut) => { if (!b) return null; const [sk, sr] = Array.isArray(s) ? s : [s, s]; cut = cut || 0;
  return [b[0].slice(0, b[0].length - cut) + sk, b[1].slice(0, b[1].length - cut) + sr]; };
const VB = (base, s, cut) => w => sfx(tvBase(w, base), s || '', cut);

// 尊敬・謙譲の ことば
function tvHon(w, kind){
  const {k, r, o} = tCore(w), st = [k.slice(0, -2), r.slice(0, -2)];
  if (w[4] === 3 && (o.goR || o.goH || o.den)){
    const n = [k.slice(0, -3), r.slice(0, -3)], pf = o.den ? ['お','お'] : ['ご','ご'];
    if (kind === 'oni' && (o.goR || o.den)) return [pf[0] + n[0] + 'になります', pf[1] + n[1] + 'になります'];
    if (kind === 'hum' && (o.goH || o.den)) return [pf[0] + n[0] + 'します', pf[1] + n[1] + 'します'];
    if (kind === 'kud' && (o.goR || o.den)) return [pf[0] + n[0] + 'ください', pf[1] + n[1] + 'ください'];
    return null;
  }
  if (kind === 'oni' && o.oni) return ['お' + st[0] + 'になります', 'お' + st[1] + 'になります'];
  if (kind === 'hum' && o.hum) return ['お' + st[0] + 'します', 'お' + st[1] + 'します'];
  if (kind === 'kud' && o.oni) return ['お' + st[0] + 'ください', 'お' + st[1] + 'ください'];
  return null;
}

function tsuDeck(les, scope, cats, picks){

  if (cat !== 'verb') return null;
  let best = null;   // （料理を）作ります の「作ります」など
  TW.forEach(w => { if (twCat(w) !== 'verb' || (g && w[4] !== g)) return; const c = tCore(w); if (c.k === word && (!best || w[1] < best[1])) best = w; });

// 自動詞・他動詞：語は「窓[まど]が 閉まります」の 形
function tsPair(fid, word){
  const m = word.match(/^(.+?)([がを]) (.+)$/); if (!m) return null;

}
// 1枚の 文カード
function tsSentCard(si){
  const s = TS_SENT[si], [cat, fid] = s[0].split('|'), d = TFI[cat][fid];

function tsSentDeck(les, scope, cats, picks){
  const ok = s => { const [c, f] = s[0].split('|'), d = TFI[c][f]; if (!d) return false;
    if (picks && picks.length) return picks.includes(s[0]);
    if (!cats.includes(c)) return false;
    const l = FL(c, f, les); if (!l) return false;
    return scope === 'form' && !isReview(les) ? l === les : l <= les; };
  const out = [];

}
// クイズ：同じ 語の ほかの 形を 文に 入れる
function tsSentQuiz(card){
  const s = TS_SENT[card.si], [cat, fid] = s[0].split('|');
  const opts = [], seen = new Set([card.a]);
  if (fid === 'jita' || fid === 'taji'){
    const p = tsPair(fid, s[2]);
    const m = s[2].match(/^(.+?)([がを]) (.+)$/), np = m[2] === 'を' ? 'が' : 'を';
    [m[1] + m[2] + ' ' + rubyMarkT(p.plainB[0], p.plainB[1]), m[1] + np + ' ' + rubyMarkT(p.plainF[0], p.plainF[1]), m[1] + m[2] + ' ' + rubyMarkT(p.plainF[0], p.plainF[1])]
      .forEach(x => { if (!seen.has(x)){ seen.add(x); opts.push(x); } });
  } else {
    const w = tsResolve(cat, s[2]), me = TFI[cat][fid];
    const fs = shuffle(TF[cat].filter(d => d[0] !== fid && d[0] !== 'jita' && d[0] !== 'taji').map(d => d[0]));
    fs.sort((a, b) => Math.abs(TFI[cat][a].les - me.les) - Math.abs(TFI[cat][b].les - me.les));
    for (const f of fs){
      if (opts.length >= 3) break;
      const x = tsSentAnswer(cat, f, w); if (!x) continue;
      const m = rubyMarkT(x[0], x[1]); if (seen.has(m)) continue;
      seen.add(m); opts.push(m);
    }
  }
  return shuffle([{m:card.a, ok:true}].concat(opts.slice(0, 3).map(m => ({m, ok:false}))));
}

const CAT_POOL = {};
function catPool(cat){
  if (CAT_POOL[cat]) return CAT_POOL[cat];
  const out = [];
  for (const w of CATS.find(c => c.id === cat).words){
    const same = t => twCat(t) === cat && (t[2] === w[0] || (cat === 'verb' && tCore(t).k === w[0] && tCore(t).r === w[1]));
    let i = TW.findIndex(t => same(t) && t[2] === w[0] && t[1] > 100);
    if (i < 0) i = TW.findIndex(t => same(t) && t[2] === w[0]);
    if (i < 0) i = TW.findIndex(same);
    if (i >= 0 && !out.includes(i)) out.push(i);
  }
  return CAT_POOL[cat] = out;
}
// 形の リスト（ふつうの 形 と t:～ を まぜて よい）から デッキを つくる
function deckOf(cat, forms, groups){
  const eng = forms.filter(f => f.slice(0, 2) !== 't:'), tf = forms.filter(f => f.slice(0, 2) === 't:').map(f => f.slice(2));
  const out = eng.length ? buildDeck(cat, eng, groups) : [];
  for (const f of tf) for (const i of catPool(cat)){
    if (cat === 'verb' && groups && !groups.includes(TW[i][4])) continue;
    const c = tsuCard(i, f); if (c) out.push(c);
  }
  return out;
}

function tone(seq){
  if (!S.sound) return;
  try {
    const AC = getAC(); if (!AC) return;
    const t0 = AC.currentTime + .01;
    for (const [f, st, du, type = 'sine', vol = .16] of seq){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0 + st);
      g.gain.setValueAtTime(.0001, t0 + st);
      g.gain.exponentialRampToValueAtTime(vol, t0 + st + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + st + du);
      o.connect(g); g.connect(AC.destination); o.start(t0 + st); o.stop(t0 + st + du + .03);
    }
  } catch(e){}
}

const TABS = ['home','record','settings'];

const hashOf = v => v.name === 'cat' ? 'cat-' + v.cat : v.name === 'tsu' ? 'tsu-' + v.book : v.name === 'tsl' ? 'tsl-' + v.les : HN[v.name];
function parseHash(h){
  if (/^cat-/.test(h)){ const c = h.slice(4); return CAT_IDS.includes(c) ? {name:'cat', cat:c} : null; }
  let m = h.match(/^tsu-([1-4])$/); if (m) return {name:'tsu', book:+m[1]};
  m = h.match(/^tsl-(\d+)$/); if (m && ((+m[1] >= 1 && +m[1] <= 30) || (+m[1] >= 101 && +m[1] <= 150))) return {name:'tsl', les:+m[1]};
  const n = Object.keys(HN).find(k => HN[k] === h);
  return n ? {name:n} : null;
}
let ST = [], EXPECT = null;      // ST = このアプリが つくった 履歴（ハッシュ）の 写し
const curHash = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch(e){ return location.hash.slice(1); } };
function pushHash(h){
  if (curHash() === h){ ST[ST.length - 1] = h; return; }
  ST.push(h); EXPECT = h; location.hash = h;
}
function replaceHash(h){
  if (ST.length) ST[ST.length - 1] = h; else ST.push(h);
  if (curHash() === h) return;
  try { history.replaceState(history.state, '', '#' + h); }
  catch(e){ EXPECT = h; try { location.replace('#' + h); } catch(e2){} }
}
function goBackTo(h){ ST.pop(); EXPECT = h; history.back(); }
function go(name, extra, opt){
  opt = opt || {};
  closeSheet(true);
  const nv = Object.assign({name}, extra || {}), h = hashOf(nv);
  if (ST.length > 1 && ST[ST.length - 2] === h) goBackTo(h);
  else if (opt.replace || V.name === 'play' || V.name === 'result' || V.name === 'login' ||
           (TABS.includes(V.name) && TABS.includes(name) && V.name !== 'home')) replaceHash(h);
  else pushHash(h);
  V = nv; render(); window.scrollTo(0, 0);
}
// UIの「もどる」ボタン：ほんとうの 履歴を もどる
function goBack(fallback){
  if (ST.length > 1){ const h = ST[ST.length - 2]; goBackTo(h); routeTo(h); }
  else go(fallback || 'home');
}
function routeTo(h){
  let nv = parseHash(h);
  if (!nv || ((nv.name === 'play' || nv.name === 'result') && !P)) nv = {name:'home'};
  if (nv.name === 'lang') nv.from = V.name === 'lang' ? V.from : (ST.includes('login') && !DEV.current ? 'login' : 'settings');
  closeSheet(true); closeModal();
  V = nv; render(); window.scrollTo(0, 0);
  const h2 = hashOf(V); if (h2 !== h && EXPECT === null) replaceHash(h2);
}
window.addEventListener('hashchange', () => {
  const h = curHash();
  if (EXPECT !== null && h === EXPECT){ EXPECT = null; return; }
  EXPECT = null;
  const isBack = ST.length > 1 && ST[ST.length - 2] === h;
  if (isBack) ST.pop(); else ST.push(h);
  const here = hashOf(V);
  // まず ひらいている まど（シート・かくにん）を とじる
  if (!$('#modal').hidden){ closeModal(); if (isBack && here !== h) pushHash(here); return; }
  if (SH){ closeSheet(); if (isBack && here !== h) pushHash(here); return; }
  if (V.name === 'play' && P && h !== 'play'){ pushHash('play'); confirmBox('quit_q', quitPlay); return; }
  if (h === here) return;
  routeTo(h);
});

  const scope = tsuScope(les);

  const total = deck.length, n = pr.count ? Math.min(pr.count, total) : total;
  const cur = scs.find(x => x[0] === scope);

  const stat = tsuLesStat(les);
  return '<section class="tsl">' +

        '<button class="iconbtn sm press flip-x" data-act="tsl" data-l="' + nextL + '"' + (nextL ? '' : ' disabled') + ' aria-label="次の課">' + IC.back + '</button></div></div>' +
    '<div class="les-head"><div><span class="bk-s">' + J(bk.ser === 'm' ? 'minna' : 'tsu') + ' ' + J('book' + book) + '</span><b class="num">L' + dispLes(les) + '</b></div>' +
      '<div class="ring sm">' + ring(stat.p, 52, 6, 'var(--acc)') + '<b>' + Math.round(stat.p * 100) + '%</b></div></div>' +
    '<div class="seg style big">' + [['word','st_word'],['sent','st_sent']].map(([v, k]) => '<button data-act="tstyle" data-v="' + v + '" aria-pressed="' + ((pr.style || 'word') === v) + '">' + T(k) + '</button>').join('') + '</div>' +
    '<div class="blk-h"><h2>' + J(rv ? 'sc_rev' : 'les_forms') + '</h2>' +
      (pick.length ? '<button class="mini press" data-act="tpickclear">' + IC.close + '<span>' + pick.length + ' ' + J('picked') + '</span></button>' : '') + '</div>' +
    (rv ? '<p class="vhint rv-note">' + J('rv_note') + tr('rv_note') + '</p>' : '') +
    (fs.length ? '<p class="pick-hint">' + IC.tap + '<span>' + J('pick_hint') + tr('pick_hint') + '</span></p>' : '') +

    (words.length ? '<details class="lwords"><summary>' + J('les_words') + ' <span class="num">' + words.length + '</span>' + IC.down + '</summary>' + wordsHTML + '</details>' : '') +
    (scs.length ? '<div class="blk-h"><h2>' + J('range') + '</h2></div>' +

      '</div>' +

const rubyMark = (k, r) => { const seg = rubySegments(k, r); return seg.map(([s, y]) => y ? s + '[' + y + ']' : s).join(''); };
function startTsu(les, scope, cats, picks, style){
  const pr = S.prefs.tsu;
  style = style || pr.style || 'word';
  picks = picks && picks.length ? picks.slice() : null;
  if (picks && scope === 'upto') scope = 'form';
  if (style === 'sent' && scope === 'word') scope = 'form';
  if (isReview(les) && !picks && scope === 'word') scope = 'form';
  if (isReview(les) && style === 'sent' && !picks) scope = 'form';
  const deck = shuffle(style === 'sent' ? tsSentDeck(les, scope, cats, picks) : tsuDeck(les, scope, cats, picks));
  if (!deck.length){ toast('need_form'); return; }
  const sc = {form: isReview(les) ? 'sc_rev' : 'sc_form', word:'sc_word', upto:'sc_upto'}[scope];
  const LL = 'L' + dispLes(les);
  const title = picks ? LL + '・' + picks.map(k => { const [c, f] = k.split('|'); return tsuLabel(c, f).replace('＊', '名詞[めいし]'); }).join('／')
    : LL + '・' + UI[sc].ja;
  if (picks) cats = TCATS.filter(c => picks.some(k => k.startsWith(c + '|')));
  S.last = {tsu:{les, scope, cats, picks, style}, cat:cats[0], title: title + (style === 'sent' ? '（' + UI.st_sent.ja + '）' : ''), mode:pr.mode, count:pr.count};
  save();
  startSession(cats.length === 1 ? cats[0] : 'verb', pr.mode, pr.count ? deck.slice(0, pr.count) : deck, null);
}

function startFrom(cat, forms, stepId, title){

/* --- れんしゅう --- */
function startSession(cat, mode, cards, stepId){
  const backTo = (P && P.backTo) || (V.name === 'home' ? {name:'home'} : V.name === 'tsl' ? {name:'tsl', les:V.les} : {name:'cat', cat});
  P = {backTo, cat, mode, stepId, queue: cards.slice(), total: cards.length, done: 0, first: {}, cards: cards.slice(), cur: null, flipped: false, answered: false, opts: null, dragged: false, xp: 0};
  nextCard();
}
function quitPlay(){ const b = Object.assign({}, (P && P.backTo) || {name:'home'}), n = b.name; delete b.name; P = null; go(n, b); }
function nextCard(){
  if (!P.queue.length){ SFX.done(); save(); go('result', {cat:P.cat}); return; }
  P.cur = P.queue.shift(); P.flipped = false; P.answered = false;
  P.opts = P.mode === 'quiz' ? (P.cur.sent ? tsSentQuiz(P.cur) : P.cur.tsu ? tsuQuizOptions(P.cur) : quizOptions(P.cur)) : null;
  go('play', {cat:P.cur.cat || P.cat});
}
function addXP(n){ P.xp += n; S.xp += n; }
function noteHTML(c){
  if (!c.notes || !c.notes.length) return '';
  return '<div class="notes"><b>' + esc(UI.note.ja) + '</b>' + c.notes.map(n => '<span>' + rb(n) + '</span>').join('<br>') + '</div>';
}
function meanHTML(c){ if (!S.meaning) return ''; const m = meaningOf(c.key); return m ? trSpan(m, 'mean') : ''; }
function viewPlay(){
  const c = P.cur, pct = Math.round(P.done / P.total * 100);
  const sayBtn = side => '<button class="say press' + (HAS_TTS ? '' : ' muted') + '" data-act="say" data-side="' + side + '" aria-label="' + esc(UI.listen.ja) + '">' + IC.speak + '</button>';
  const top = '<div class="ptop"><button class="iconbtn press" data-act="quit" aria-label="' + esc(UI.quit.ja) + '">' + IC.close + '</button>' +
    '<div class="ptrack"><i style="width:' + pct + '%"></i></div><div class="pnum">' + Math.min(P.done + 1, P.total) + '/' + P.total + '</div>' + musicBtn('sm') + '</div>';
  if (c.sent) return viewPlaySent(c, top, sayBtn);
  // 表：語 → ↓ → 変える形（大きく）
  const front = '<div class="face front"><div class="face-top"><span></span>' + sayBtn('front') + '</div>' +
    '<div class="face-mid">' + (c.fLead ? '<div class="lead">' + W(c.fLead) + '</div>' : '') +
    '<div class="big fit">' + W(c.front) + '</div>' + meanHTML(c) +
    '<div class="target"><span class="arrow" aria-hidden="true">↓</span><span class="tchip fit">' + cardLabel(c) + '</span></div></div>' +
    (P.mode === 'card' ? '<div class="hint">' + IC.tap + J('tap_flip') + tr('tap_flip') + '</div>' : '') + '</div>';
  if (P.mode === 'quiz'){
    const opts = P.opts.map((o, i) => '<button class="opt" data-act="pick" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="w fit">' + W(o.v) + '</span></button>').join('');
    return '<section>' + top + '<div class="stage"><div class="card quiz" id="card"><div class="inner">' + front + '</div></div></div>' +
      '<p class="qtitle">' + T('quiz_q') + '</p><div class="opts" id="opts">' + opts + '</div><div id="fb"></div></section>';
  }
  const back = '<div class="face back"><div class="face-top"><span class="fchip">' + cardLabel(c) + '</span>' + sayBtn('back') + '</div>' +
    '<div class="face-mid"><div class="from fit">' + (c.fLead ? W(c.fLead) + ' ' : '') + W(c.front) + ' →</div>' +
    (c.bLead ? '<div class="lead">' + W(c.bLead) + '</div>' : '') +
    '<div class="big fit">' + W(c.back) + '</div>' + (c.meta ? '<div class="meta">' + rb(c.meta) + '</div>' : '') + '</div>' +
    noteHTML(c) + '<span class="stamp s-got">' + esc(UI.got.ja) + '</span><span class="stamp s-again">' + esc(UI.again.ja) + '</span></div>';

    return '<section>' + top + '<div class="stage"><div class="card quiz" id="card"><div class="inner">' + front + '</div></div></div>' +

  return '<section>' + top +

    '<div id="acts">' + cardActs() + '</div></section>';

function cardActs(){
  if (!P.flipped) return '<button class="btn lime" data-act="flip">' + T('show') + '</button>';
  return '<div class="row"><button class="btn soft" data-act="again">' + T('again') + '</button><button class="btn ok" data-act="got">' + T('got') + '</button></div>' +
    '<p class="swipe-hint">← ' + esc(UI.again.ja) + '　／　' + esc(UI.got.ja) + ' →</p>';
}
function flip(){
  if (!P || P.mode !== 'card' || P.dragged) return;
  P.flipped = !P.flipped;
  $('#card').classList.toggle('flipped', P.flipped);
  $('#acts').innerHTML = cardActs();
  SFX.flip();
  if (P.flipped) requestAnimationFrame(() => document.querySelectorAll('.face.back .fit').forEach(fit));
}
function answerCard(known){
  const c = P.cur;
  if (!(c.id in P.first)) P.first[c.id] = known;
  bump(c, known);
  if (known){ S.learned[c.id] = 1; P.done++; addXP(10); SFX.good(); }
  else { P.queue.splice(Math.min(3, P.queue.length), 0, c); addXP(2); SFX.soft(); }
  save(); nextCard();
}
function flyAway(dir){
  const el = $('#card'); if (!el) return;
  el.style.transition = 'transform .22s ease-in';
  el.style.transform = 'translateX(' + (dir * 130) + '%) rotate(' + (dir * 18) + 'deg)';
  setTimeout(() => answerCard(dir > 0), 200);
}
function bindSwipe(el){
  if (!el) return;
  let x0 = null, dx = 0;
  el.addEventListener('pointerdown', e => {
    if (!P.flipped || e.target.closest('.say')) return;
    x0 = e.clientX; dx = 0; el.style.transition = 'none';
    try { el.setPointerCapture(e.pointerId); } catch(_){}
  });
  el.addEventListener('pointermove', e => {
    if (x0 == null) return;
    dx = e.clientX - x0;
    if (Math.abs(dx) > 8) P.dragged = true;
    el.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 20) + 'deg)';
    el.classList.toggle('lean-got', dx > 45);
    el.classList.toggle('lean-again', dx < -45);
  });
  const end = () => {
    if (x0 == null) return;
    x0 = null; el.style.transition = '';
    if (dx > 90) flyAway(1);
    else if (dx < -90) flyAway(-1);
    else { el.style.transform = ''; el.classList.remove('lean-got', 'lean-again'); }
    setTimeout(() => { if (P) P.dragged = false; }, 30);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function pick(i){
  if (P.answered) return;
  P.answered = true;
  const c = P.cur, o = P.opts[i];
  P.first[c.id] = o.ok; bump(c, o.ok); P.done++;
  if (o.ok){ S.learned[c.id] = 1; addXP(10); SFX.good(); } else { addXP(2); SFX.bad(); }
  save();
  document.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (P.opts[j].ok) b.classList.add('ok'); else if (j === i) b.classList.add('ng'); else b.classList.add('dim');
  });
  $('.ptrack i').style.width = Math.round(P.done / P.total * 100) + '%';
  const k = o.ok ? 'correct' : 'wrong';
  $('#fb').innerHTML = '<div class="fb ' + (o.ok ? 'good' : 'bad') + ' enter"><div class="msg">' + (o.ok ? IC.ok : IC.ng) + '<div>' + T(k) + '</div>' +
    '<button class="say press' + (HAS_TTS ? '' : ' muted') + '" data-act="sayans" aria-label="' + esc(UI.listen.ja) + '">' + IC.speak + '</button></div>' +
    noteHTML(c) + '<button class="btn lime" data-act="next">' + T('next') + '</button></div>';
  setTimeout(() => { const b = $('#fb .btn'); b && b.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 60);
}
